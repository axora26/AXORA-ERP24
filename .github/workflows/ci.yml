name: CI

on:
  push:
    branches: [main, "feat/**", "codex/**"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build:packages
      - run: pnpm build

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: axora
          POSTGRES_PASSWORD: axora_ci_password
          POSTGRES_DB: axora_erp24_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axora -d axora_erp24_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://axora:axora_ci_password@localhost:5432/axora_erp24_ci?schema=public
      SESSION_COOKIE_NAME: axora_erp24_session
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @axora24/database exec prisma migrate deploy
      - name: Cles MFA et integrations ephemeres (jamais committees)
        run: |
          echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "INTEGRATION_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm build:packages
      - run: pnpm test:e2e

  browser-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: axora
          POSTGRES_PASSWORD: axora_ci_password
          POSTGRES_DB: axora_erp24_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axora -d axora_erp24_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://axora:axora_ci_password@localhost:5432/axora_erp24_ci?schema=public
      SESSION_COOKIE_NAME: axora_erp24_session
      API_PORT: "4000"
      AUTOMATION_AUTORUN: "false"
      E2E_BASE_URL: http://localhost:3200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @axora24/database exec prisma migrate deploy
      - name: Cles MFA et integrations ephemeres (jamais committees)
        run: |
          echo "MFA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "INTEGRATION_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm build:packages
      - run: pnpm build
      - name: API et interface de production (service worker actif)
        run: |
          (cd apps/api && node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && npx next start -p 3200 > ../../web.log 2>&1 &)
          npx --yes wait-on@8 --timeout 120000 http://localhost:4000/health http://localhost:3200/login
      - name: Jeu DEMO charge via l'API reelle
        run: pnpm demo:seed
      - run: pnpm --filter @axora24/web exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
            web.log
